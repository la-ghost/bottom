name: Windows temperature build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-libre-temperature
    tags:
      - windows-temp-*

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and package
        shell: pwsh
        run: .\scripts\build-windows-temperature.ps1

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path .\dist\bottom-windows-temperature\* -DestinationPath .\bottom-windows-temperature-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bottom-windows-temperature-x64
          path: bottom-windows-temperature-x64.zip
